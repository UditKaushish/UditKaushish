<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Udit Kaushish, AI Engineer and Product Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#4338ca">
        <animate attributeName="stop-color" values="#4338ca;#7c3aed;#4338ca" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0891b2">
        <animate attributeName="stop-color" values="#0891b2;#0d9488;#0891b2" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <path d="M0 250 C 200 205, 400 290, 600 245 S 1000 200, 1200 250 L1200 300 L0 300 Z" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M0 270 C 250 235, 450 300, 700 262 S 1050 240, 1200 272 L1200 300 L0 300 Z" fill="#ffffff" fill-opacity="0.09"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="600" y="118" font-size="68" font-weight="800" letter-spacing="-1">Udit Kaushish</text>
    <text x="600" y="166" font-size="27" font-weight="600" fill="#e0e7ff">AI Engineer &amp; Product Manager</text>
    <g font-size="17" font-weight="600">
      <rect x="318" y="196" width="76" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="356" y="219">RAG</text>
      <rect x="406" y="196" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="465" y="219">AI Agents</text>
      <rect x="536" y="196" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="588" y="219">NL2SQL</text>
      <rect x="652" y="196" width="76" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="690" y="219">MCP</text>
      <rect x="740" y="196" width="142" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="811" y="219">LLM Evals</text>
    </g>
  </g>
</svg>
